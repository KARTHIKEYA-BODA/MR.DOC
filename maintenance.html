<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Under Maintenance | Mr.Doc</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1020;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { width: min(100%, 500px); }
    .icon { font-size: 64px; line-height: 1.2; }
    h1 { margin: 18px 0 12px; font-size: clamp(28px, 7vw, 36px); }
    p { color: #b8c2d8; line-height: 1.7; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid #394765;
      border-radius: 24px;
      color: #93c5fd;
    }
    .status-dot { color: #60a5fa; }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="icon" aria-hidden="true">🛠️</div>
    <h1 id="page-title">We'll Be Back Soon!</h1>
    <p>Our website is temporarily undergoing maintenance to improve your experience.</p>
    <div class="status" role="status"><span class="status-dot" aria-hidden="true">●</span> Temporarily unavailable</div>
    <p>Thank you for your patience.</p>
  </main>
</body>
</html>
